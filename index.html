tärke\nWichtig: Nur weil da Navigationsansagen auf nicht ganz leise steht heißt es nicht dass sie eingeschaltet sind Das ist auch beim Verkehrsfunk oder so. Die kann man woanders ein nzw. aus schalten", "info": "", "img": "images/ae6832b8_c1_s1.jpg", "w": 1600, "h": 1200, "shapes": [{"t": "rect", "x1": 0.54688, "y1": 0.10981, "x2": 0.74896, "y2": 0.22786, "c": "#ff3b30", "w": 7.0}]}]}, {"id": "982ecea0", "label": "Klang", "substeps": [{"text": "Das gewünschte Klangprofil einstellen.\nTipp: Radio einschalten und scheuen was sich am besten anhört\n\nAnweisungstext:\nSchieberegler für den Subwoofer (- bis +):\n- In Richtung + schieben: Macht den Bass kräftiger und spürbarer. Musik hat mehr Wums.\n- In Richtung - schieben: Reduziert den Bass. Stimmen und Sprache werden klarer verständlich.", "info": "Der Subwoofer ist eine spezielle Lautsprecher-Box (meist im Kofferraum oder unter dem Boden verbaut), die ausschließlich für die tiefen Bässe und Trommelschläge zuständig ist.\n\nEmpfohlene Einstellung: Für normale Musik und Radio reicht eine Stellung in der Mitte. Wenn dir die Musik zu stark dröhnt oder Kopfweh verursacht, schiebe den Regler etwas ins Minus (-). Wenn du mehr Bass bei elektronischer Musik oder Rock willst, schiebe ihn ins Plus (+).", "img": "images/ae6832b8_c2_s1.jpg", "w": 1600, "h": 1028, "shapes": []}]}, {"id": "8d3139ba", "label": "Fokus", "substeps": [{"text": "Anweisungstext:\n1. Roter Rahmen (Balance-Fader):\n- Bestimmt, wo im Auto der Ton am lautesten ist.\n- Über die Pfeiltasten (oder durch Tippen auf die Sitze) verschiebst du den Fadenkreuz-Mittelpunkt nach vorne, hinten, links oder rechts.\n- Taste \"Zentrieren\": Setzt den Klang sofort wieder perfekt auf die Mitte des Autos zurück.\n\n2. Gelber Rahmen (Fokus):\n- Legt fest, auf welche Sitzplätze der Klang optimiert wird (z. B. \"Fahrer\" oder \"Alle\").\n- In der Position \"Alle\" hören alle Insassen den bestmöglichen Raumklang.\n\n3. Grüner Rahmen (Surround):\n- Erzeugt einen räumlicheren Hüllkurven-Klang im Innenraum.\n- Auswählbare Stufen: Stark, Mittel, Schwach oder Aus.\n- Empfohlene Einstellung: \"Mittel\" für einen natürlichen und vollen Raumklang.", "info": "", "img": "images/ae6832b8_c3_s1.jpg", "w": 1600, "h": 1040, "shapes": [{"t": "rect", "x1": 0.29013, "y1": 0.18441, "x2": 0.47303, "y2": 0.29693, "c": "#ff3b30", "w": 7.6818}, {"t": "rect", "x1": 0.48789, "y1": 0.19496, "x2": 0.61934, "y2": 0.29869, "c": "#ffcc00", "w": 7.6818}, {"t": "rect", "x1": 0.64678, "y1": 0.18617, "x2": 0.79881, "y2": 0.29517, "c": "#34c759", "w": 7.6818}]}]}]}]}, {"id": "01bf4971", "name": "Assistenzsysteme", "steps": [{"id": "35bff3c8", "title": "Verschieden Systeme ein- ausschalten", "text": "Auf Assist drücken", "info": "", "img": "images/35bff3c8.jpg", "w": 1600, "h": 1200, "shapes": [{"t": "rect", "x1": 0.03125, "y1": 0.40558, "x2": 0.18021, "y2": 0.68197, "c": "#ff3b30", "w": 7.0}], "substeps": [{"text": "Wähle durch einfaches Antippen einen der oberen Reiter aus:\n\n1. Roter Rahmen (Favoriten):\n- Zeigt deine selbst gewählten Lieblings-Assistenten auf einen Blick (z.B. Warnton, Lane Assist, Aufmerksamkeit, Müdigkeit).\n- Direktes Ein- und Ausschalten über den Schalter im jeweiligen Kasten.\n- Über die drei Punkte (...) rechts unten im Kasten gelangst du zu den genauen Informationen und Detail-Einstellungen des jeweiligen Assistenten.\n\n2. Gelber Rahmen (Fahrt):\n- Öffnet die Liste aller fahrtbezogenen Assistenten (wie Abstands-, Geschwindigkeits-, Ampelwarnung und vorausschauende Eco-Assistenz).\n\n3. Grüner Rahmen (Fahrspuren):\n- Öffnet die Einstellungen für Spurhalte- und Spurwechsel-Assistenten (Lane Assist, Side Assist, assistierter Spurwechsel).\n\n4. Blauer Rahmen (Sicherheit):\n- Öffnet sicherheitsrelevante Systeme wie Notbremsassistent (Front Assist) und Aufmerksamkeits-/Müdigkeitswarnungen.", "info": "Tipps zum Menü:\n- Einfaches Drauftippen auf einen Reiter wechselt sofort die Ansicht.\n- Die drei kleinen Punkte (...) in den Kacheln öffnen jeweils die detaillierten Informationen und Zusatzoptionen zum jeweiligen System.", "img": "images/35bff3c8_s1.jpg", "w": 1600, "h": 1200, "shapes": [{"t": "rect", "x1": 0.23438, "y1": 0.14755, "x2": 0.39479, "y2": 0.24199, "c": "#ff3b30", "w": 7.0}, {"t": "rect", "x1": 0.4125, "y1": 0.16283, "x2": 0.52396, "y2": 0.22255, "c": "#ffcc00", "w": 7.0}, {"t": "rect", "x1": 0.53646, "y1": 0.13921, "x2": 0.66875, "y2": 0.2281, "c": "#34c759", "w": 7.0}, {"t": "rect", "x1": 0.69479, "y1": 0.15449, "x2": 0.80833, "y2": 0.22394, "c": "#0a84ff", "w": 7.0}]}], "choices": []}]}, {"id": "c37cabfc", "name": "Fahrmodi", "steps": [{"id": "16ac60a4", "title": "Fahrmodi einstellen", "text": "Auf Mode klicken", "info": "", "img": "images/16ac60a4.jpg", "w": 1600, "h": 1200, "shapes": [{"t": "rect", "x1": 0.275, "y1": 0.44169, "x2": 0.17083, "y2": 0.64169, "c": "#ff3b30", "w": 7.0}], "substeps": [{"text": "passen auswählen oder selbst konfigurieren", "info": "", "img": "images/16ac60a4_s1.jpg", "w": 1600, "h": 1200, "shapes": []}], "choices": [{"id": "40ab9aad", "label": "selbst konfigurieren", "substeps": [{"text": "Auf den Stift drücken", "info": "", "img": "images/16ac60a4_c1_s1.jpg", "w": 1600, "h": 1200, "shapes": [{"t": "ellipse", "x1": 0.50521, "y1": 0.5326, "x2": 0.53854, "y2": 0.58398, "c": "#ff3b30", "w": 7.0}]}, {"text": "Alle Werte wie gewünscht einstellen.", "info": "", "img": "images/16ac60a4_c1_s2.jpg", "w": 1600, "h": 1200, "shapes": []}]}]}]}, {"id": "55450da2", "name": "Licht", "steps": [{"id": "386ad13f", "title": "Verschieden Lichter einstellen", "text": "auf Fahrzeug klicken", "info": "", "img": "images/386ad13f.jpg", "w": 1600, "h": 1200, "shapes": [{"t": "rect", "x1": 0.23854, "y1": 0.53474, "x2": 0.33646, "y2": 0.70419, "c": "#ff3b30", "w": 7.0}], "substeps": [{"text": "Wenn noch nicht da auf Licht drücken", "info": "", "img": "images/386ad13f_s1.jpg", "w": 1600, "h": 1200, "shapes": [{"t": "rect", "x1": 0.31771, "y1": 0.09755, "x2": 0.53542, "y2": 0.22394, "c": "#ff3b30", "w": 7.0}]}], "choices": [{"id": "6d26930d", "label": "Ambientebeleuchtung einstellen", "substeps": [{"text": "auf Ambientebeleuchtung drücken", "info": "", "img": "images/386ad13f_c1_s1.jpg", "w": 1600, "h": 1200, "shapes": [{"t": "rect", "x1": 0.63021, "y1": 0.2951, "x2": 0.85, "y2": 0.38121, "c": "#ff3b30", "w": 7.0}]}, {"text": "Alles nach belieben einstellen", "info": "", "img": "images/386ad13f_c1_s2.jpg", "w": 1600, "h": 1200, "shapes": []}]}, {"id": "2d222281", "label": "Außen", "substeps": [{"text": "auf außen drücken", "info": "", "img": "images/386ad13f_c2_s1.jpg", "w": 1600, "h": 1200, "shapes": [{"t": "rect", "x1": 0.23542, "y1": 0.2768, "x2": 0.39062, "y2": 0.39902, "c": "#ff3b30", "w": 7.0}]}, {"text": "", "info": "", "img": null, "w": 0, "h": 0, "shapes": []}]}]}]}]}, {"id": "0379ff1e", "name": "Auto selbst", "groups": [{"id": "c2dc079f", "name": "Lenkrad", "steps": [{"id": "bc601103", "title": "Lenkradhöhe anpassen", "text": "Hebel kräftig nach unten drücken, dann Lenkrad in die gewünschte Position stellen. Hebel wieder zurückstellen", "info": "", "img": "images/bc601103.jpg", "w": 1600, "h": 1522, "shapes": [{"t": "arrow", "x1": 0.6648, "y1": 0.33081, "x2": 0.54494, "y2": 0.50013, "c": "#ff3b30", "w": 7.0787}], "substeps": [], "choices": []}, {"id": "c990aa42", "title": "Lenkradfunktionen erklärt", "text": "1. Linke Lenkradseite (Medien, Lautstärke & Komfort):\n\nSprachsteuerung (Taste oben links mit Mund-Symbol): Aktiviert die Sprachassistentin „Laura“ („Okay Škoda“).\n\nLenkradheizung (Taste oben daneben): Schaltet die Lenkradheizung ein oder aus.\n\nLautstärke-Regler (Mittleres Rändelrad): Nach oben/unten drehen, um die Lautstärke zu regeln. Einmal drücken, um den Ton stummzuschalten (Mute).\n\nTitel- / Senderwahl (Tasten unten): Springt zum nächsten oder vorherigen Musik-Titel bzw. Radiosender.\n\n2. Rechte Lenkradseite (Fahrassistenz & Cockpit-Steuerung):\n\nAssistenzsysteme (Taste oben rechts): Öffnet direkt das Menü für die Fahrhilfen (wie Spurhalteassistent, ACC etc.).\n\nCockpit-Ansichten (Pfeiltasten): Schaltet im digitalen Kombiinstrument (vor dem Lenkrad) zwischen verschiedenen Ansichten und Layouts um.\n\nMenü- & Anruf-Regler (Rechtes Rändelrad):\n\nDrehen: Blättert durch Menüs, Listen oder Radiosender.\n\nDrücken: Bestätigt Aktionen oder nimmt einen eingehenden Anruf an.", "info": "Die Rändelräder reagieren sowohl auf feines Drehen als auch auf Klicks.", "img": "images/c990aa42.jpg", "w": 1600, "h": 1200, "shapes": [], "substeps": [], "choices": []}]}, {"id": "dc588e03", "name": "Licht", "steps": [{"id": "83565104", "title": "Bedienfeld Innenbeleuchtung", "text": "Leseleuchten oben links/rechts: Durch direktes Antippen der Glasflächen schaltest du die jeweilige Leseleuchte ein oder aus.\n\nGanzes Innenlicht einschalten (Symbol ganz links): Tippen schaltet die gesamte Innenraumbeleuchtung manuell an oder aus.\n\nTür-Automatik / Licht bei Türöffnung (OFF-Symbol mit Auto & Tür): Wenn die gelbe Kontrollleuchte OFF leuchtet, ist das automatische Einschalten des Innenlichts beim Öffnen der Türen deaktiviert. Nochmaliges Antippen aktiviert die Tür-Automatik wieder.", "info": "SOS-Taste & Airbag-Anzeige:\n\nPASSENGER AIRBAG: Zeigt an, ob der Beifahrer-Airbag aktiv oder (z. B. für einen Kindersitz) deaktiviert ist.", "img": "images/83565104.jpg", "w": 1600, "h": 918, "shapes": [], "substeps": [], "choices": []}, {"id": "8821a142", "title": "Lichtautomatik, Allwetterlicht / Schlechtwetter und Nebelschlussleuchte", "text": "AUTO- & Lichttaste (erste Taste links): Schaltet die Lichtautomatik ein oder aus (grün leuchtend). \n\nSchlechtwetterlicht (mittlere Taste): Optimiert die Ausleuchtung der Fahrbahn bei starkem Nebel, Regen oder Schneefall.\n\nNebelschlussleuchte (rechte Taste): Schaltet die rote Nebelschlussleuchte für extreme Sichtverhältnisse ein (nur aktivierbar, wenn das Hauptlicht brennt).", "info": "Im AUTO-Modus schaltet das Fahrzeug das Licht je nach Helligkeit vollkommen selbstständig ein und aus.\n\nDie Nebelschlussleuchte darf laut Gesetz nur bei sehr dichten Sichtverhältnissen (unter 50 Metern) genutzt werden, um nachfolgende Verkehrsteilnehmer nicht zu blenden.", "img": "images/8821a142.jpg", "w": 1600, "h": 855, "shapes": [], "substeps": [], "choices": []}]}, {"id": "cad63b3f", "name": "Verschiedene Hebel z.B. Gang, Tempomat, ...", "steps": [{"id": "37f6eb4f", "title": "Wie bediene ich den Ganghebel und die Parkbremse", "text": "Bedienung des Gangwahlhebels:\n\nNach vorne schieben: Einmal schieben schaltet in Neutral (N – Leerlauf, Auto lässt sich rollen/schieben). Nochmals nach vorne schieben schaltet in den Rückwärtsgang (R).\n\nNach hinten ziehen: Einmal nach hinten ziehen schaltet in den Fahrbetrieb (D). Nochmals nach hinten ziehen schaltet in den B-Modus (B).\n\nElektrische Parkbremse (Taste rechts):\n\nZiehen / Drücken der (P)-Taste: Stellt die Parkbremse manuell ein bzw. löst sie. Bei aktiver Parkbremse leuchtet die rote Kontrollleuchte in der Taste. Beim Anfahren löst sich die Parkbremse automatisch, wenn der Sicherheitsgurt angelegt ist.\n", "info": "Unterschied zwischen D und B:\n\nD (Drive): Normaler Fahrmodus mit automatischer/leichter Rekuperation. Der Wagen „segelt“ beim Loslassen des Fahrpedals sanft weiter, um Energie zu sparen.\n\nB (Brake): Verstärkte Bremsenergierückgewinnung (Rekuperation). Sobald du vom Gas gehst, verzögert das Fahrzeug spürbar stärker und speist mehr Energie zurück in die Hochvoltbatterie. Ideal für den Stadtverkehr oder Bergabfahrten.\n", "img": "images/37f6eb4f.jpg", "w": 1600, "h": 770, "shapes": [{"t": "text", "x": 0.64583, "y": 0.15371, "text": "Parkbremse", "c": "#ff3b30", "s": 46.0}, {"t": "arrow", "x1": 0.71042, "y1": 0.25977, "x2": 0.80104, "y2": 0.526, "c": "#ff3b30", "w": 7.0}, {"t": "text", "x": 0.31562, "y": 0.13423, "text": "Ganghebel", "c": "#ffcc00", "s": 46.0}, {"t": "arrow", "x1": 0.35313, "y1": 0.23596, "x2": 0.23646, "y2": 0.47189, "c": "#ffcc00", "w": 7.0}], "substeps": [], "choices": []}, {"id": "541042ee", "title": "Tempomat- und Assistenzhebel", "text": "Grundlegende Bedienung des Hebels:\n\nEin- / Ausschalten:\n\nGanz nach vorne drücken = OFF (schaltet das System aus).\n\nZu dir ziehen (nach hinten) = ON (schaltet das System ein).\n\nGeschwindigkeit speichern (SET):\n\nDrücke die seitliche SET-Taste und ziehe den Hebel zu dir, um die aktuelle Geschwindigkeit zu übernehmen.\n\nAbbruch (CANCEL):\n\nSchiebe den Hebel kurz leicht nach vorne, um den Tempomaten zu unterbrechen. Der Hebel federt automatisch in die Ausgangsposition zurück.\n\nGeschwindigkeit anpassen (Hebel hoch / runter):\n\nTippe den Hebel nach oben (+) oder nach unten (-), um das eingestellte Tempo feiner zu regulieren.\n\nAbstand einstellen (Drehregler oben):\n\nDrehe das kleine Rad oben (- DISTANCE +), um den Sicherheitsabstand zum Vordermann zu verändern.", "info": "Intelligenter Adaptiver Tempomat (ACC):\n\nDas Auto hält nicht nur starr die eingestellte Geschwindigkeit, sondern bremst automatisch ab, wenn ein langsamerer Vordermann auftaucht, und beschleunigt danach wieder von allein.\n", "img": "images/541042ee.jpg", "w": 1600, "h": 1169, "shapes": [], "substeps": [], "choices": []}, {"id": "f5aa1dd9", "title": "Fernlicht- & Lichthupe-Hebel", "text": "Bedienung von Lichthupe, Fernlicht & Automatikmodus:\n\nLichthupe (1x Symbol - Zu dir ziehen):\n\nZiehst du den Hebel kurz zu dir her (Richtung Lenkrad), leuchtet das Fernlicht einmalig kurz auf (Lichthupe). Danach federt der Hebel sofort wieder in die Mittelstellung zurück.\n\nFernlicht-Automatik einschalten (Einmal nach vorne drücken):\n\nDrückst du den Hebel einmal nach vorne (Richtung Armaturenbrett), schaltet sich der Automatikmodus (Fernlicht-Assistent) ein. Das Auto blendet Gegenverkehr automatisch aus.\n\nAutomatikmodus ausschalten (Besondere Schaltfolge!):\n\nUm den Automatikmodus wieder zu deaktivieren, musst du den Hebel zuerst noch einmal nach vorne drücken, damit das Fernlicht dauerhaft an ist.\n\nErst danach kannst du den Hebel wieder nach hinten (zu dir) ziehen, um das Fernlicht komplett auszuschalten und wieder im normalen Abblendlicht zu sein.", "info": "Bei niedrigen Geschwindigkeiten (z. B. innerorts unter ca. 30–60 km/h) bleibt das Fernlicht im Automatikmodus aus Sicherheitsgründen inaktiv.", "img": "images/f5aa1dd9.jpg", "w": 1200, "h": 1600, "shapes": [], "substeps": [], "choices": []}, {"id": "106445cb", "title": "Scheibenwischerhebel", "text": "1. Vertikale Positionen (Hebel hoch / runter bewegen):\n\n1x (Einmal wischen): Hebel ganz kurz nach unten tippen und loslassen – der Scheibenwischer wischt genau einmal über die Frontscheibe (ideal bei einzelnen Regentropfen).\n\nOFF (Aus): Die Grundstellung. Alle Scheibenwischer sind ausgeschaltet.\n\nINT (Intervall- / Regensensor-Betrieb): Eine Stufe nach oben rasten. Bei Autos mit Regensensor wischt er automatisch je nach Regenmenge.\n\nLOW (Langsames Dauerwischen): Zweite Stufe nach oben für normalen Dauerregen.\n\nHIGH (Schnelles Dauerwischen): Dritte Stufe ganz nach oben für sehr starken Starkregen.\n\n2. Drehregler oben am Hebel (Regentropfen-Symbole):\n\nStellt nicht die Wassermenge ein, sondern die Empfindlichkeit des Regensensors bzw. die Wisch-Häufigkeit im Intervallmodus (INT).\n\nnach rechts (große Tropfen): Höhere Empfindlichkeit – der Wischer reagiert schneller und wischt häufiger.\n\nnach links (kleine Tropfen): Geringere Empfindlichkeit – wischt seltener.\n\n3. Front- & Heckscheibe wischen / waschen (Hebel zu dir oder nach vorne):\n\nFrontscheibe waschen (Zu dir ziehen): Ziehe den Hebel zum Lenkrad her. Scheibenwaschwasser spritzt auf die Frontscheibe und die Wischer wischen automatisch nach.\n\nHeckscheibe wischen (Einmal nach vorne drücken): Drücke den Hebel eine Raste nach vorne (weg von dir). Der Heckscheibenwischer wischt im Intervallbetrieb.\n\nHeckscheibe waschen (Ganz nach vorne drücken und halten): Drücke den Hebel über den spürbaren Widerstand ganz nach vorne und halte ihn gedrückt. Waschwasser spritzt auf die Heckscheibe.", "info": "", "img": "images/106445cb.jpg", "w": 1600, "h": 1200, "shapes": [{"t": "rect", "x1": 0.19479, "y1": 0.17641, "x2": 0.89271, "y2": 0.63058, "c": "#34c759", "w": 7.0}], "substeps": [], "choices": []}, {"id": "072420ec", "title": "Rekuperations-Schaltwippen (Hinter dem Lenkrad +/-)", "text": "Bedienung der Wippen (Zu dir ziehen):\n\nLinke Wippe (- / Schwächere Bremswirkung):\n\nZiehst du die linke Wippe zu dir her, verringerst du die Rekuperation. Das Auto bremst beim Loslassen des Gaspedals weniger ab und \"segelt\" mehr.\n\nRechte Wippe (+ / Stärkere Bremswirkung):\n\nZiehst du die rechte Wippe zu dir her, erhöhst du die Rekuperation (Bremsenergierückgewinnung). Das Auto bremst spürbar stärkere ab, sobald du vom Gas gehst.", "info": "Die Wippen erlauben es dir, im Fahrmodus D die Bremswirkung dynamisch anzupassen – zum Beispiel vor einer Kurve oder Bergabfahrt (mehrfach rechts ziehen, um ohne Fußbremse langsamer zu werden).\n\nSobald du wieder Strom gibst oder der automatische Assistent eingreift, springt das Fahrzeug nach kurzer Zeit wieder in den gewählten Grundmodus zurück.", "img": "images/072420ec.jpg", "w": 1600, "h": 1200, "shapes": [{"t": "arrow", "x1": 0.06354, "y1": 0.06808, "x2": 0.13125, "y2": 0.20002, "c": "#34c759", "w": 7.0}, {"t": "arrow", "x1": 0.81042, "y1": 0.10002, "x2": 0.79375, "y2": 0.20974, "c": "#34c759", "w": 7.0}, {"t": "text", "x": 0.79479, "y": 0.05141, "text": "+", "c": "#ff3b30", "s": 46.0}, {"t": "text", "x": 0.04167, "y": 0.01252, "text": "-", "c": "#ff3b30", "s": 46.0}], "substeps": [], "choices": []}, {"id": "0469e91e", "title": "Außenspiegel-Verstellung & Funktionen", "text": "Schalter-Positionen durch Drehen des Knopfs:\n\n0 (Mitte / Neutral): Neutralstellung. Verhindert versehentliches Verstellen der Spiegel während der Fahrt.\n\nL (Links - Linker Spiegel): Drehe den Knopf auf L, um den linken Außenspiegel einzustellen.\n\nR (Rechts - Rechter Spiegel): Drehe den Knopf auf R, um den rechten Außenspiegel einzustellen.\n\nHeizungssymbol (Unter R): Aktiviert die Beheizung beider Außenspiegel, um Beschlag oder Eis rasch zu schmelzen.\n\nAnklappsymbol (Unter L): Klappt beide Außenspiegel elektrisch an die Karosserie an (ideal bei engen Parklücken oder in Waschanlagen).\n\nSpiegelwinkel einstellen (Joystick-Funktion):\n\nStelle den Schalter zuerst auf L oder R.\n\nKippe den Knopf nun wie einen Joystick nach oben, unten, links oder rechts, um das Glas des jeweiligen Spiegels im gewünschten Winkel auszurichten.", "info": "", "img": "images/0469e91e.jpg", "w": 1200, "h": 1600, "shapes": [{"t": "text", "x": 0.30556, "y": 0.06808, "text": "L", "c": "#ffffff", "s": 46.0}, {"t": "text", "x": 0.53889, "y": 0.08336, "text": "0", "c": "#ffffff", "s": 46.0}, {"t": "text", "x": 0.82222, "y": 0.08058, "text": "R", "c": "#ffffff", "s": 46.0}, {"t": "arrow", "x1": 0.32407, "y1": 0.10974, "x2": 0.47963, "y2": 0.26391, "c": "#ffcc00", "w": 7.0}, {"t": "arrow", "x1": 0.55556, "y1": 0.13058, "x2": 0.56296, "y2": 0.23474, "c": "#ffcc00", "w": 7.0}, {"t": "arrow", "x1": 0.84074, "y1": 0.11947, "x2": 0.6463, "y2": 0.26808, "c": "#ffcc00", "w": 7.0}, {"t": "text", "x": 0.68148, "y": 0.49308, "text": "Heizung", "c": "#ff3b30", "s": 46.0}, {"t": "text", "x": 0.07407, "y": 0.39447, "text": "Anklappen", "c": "#34c759", "s": 46.0}, {"t": "arrow", "x1": 0.28148, "y1": 0.39169, "x2": 0.46667, "y2": 0.35697, "c": "#34c759", "w": 7.0}, {"t": "arrow", "x1": 0.69444, "y1": 0.49308, "x2": 0.61111, "y2": 0.37502, "c": "#ff3b30", "w": 7.0}], "substeps": [], "choices": []}]}]}]};

function fontFor(px){return "700 "+px+"px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif";}
function drawShape(ctx,s,W,H){
  const u=W/1000;
  ctx.save();
  ctx.strokeStyle=s.c;ctx.fillStyle=s.c;
  ctx.lineWidth=Math.max(1,(s.w||6)*u);ctx.lineCap="round";ctx.lineJoin="round";
  if(s.t==="rect"){
    ctx.strokeRect(Math.min(s.x1,s.x2)*W,Math.min(s.y1,s.y2)*H,Math.abs(s.x2-s.x1)*W,Math.abs(s.y2-s.y1)*H);
  }else if(s.t==="ellipse"){
    ctx.beginPath();
    ctx.ellipse((s.x1+s.x2)/2*W,(s.y1+s.y2)/2*H,Math.max(1,Math.abs(s.x2-s.x1)*W/2),Math.max(1,Math.abs(s.y2-s.y1)*H/2),0,0,Math.PI*2);
    ctx.stroke();
  }else if(s.t==="arrow"){
    const x1=s.x1*W,y1=s.y1*H,x2=s.x2*W,y2=s.y2*H;
    const a=Math.atan2(y2-y1,x2-x1);
    const head=Math.max(12*u,(s.w||6)*u*4);
    ctx.beginPath();ctx.moveTo(x1,y1);
    ctx.lineTo(x2-Math.cos(a)*head*0.6,y2-Math.sin(a)*head*0.6);
    ctx.stroke();
    ctx.beginPath();ctx.moveTo(x2,y2);
    ctx.lineTo(x2-head*Math.cos(a-Math.PI/7),y2-head*Math.sin(a-Math.PI/7));
    ctx.lineTo(x2-head*Math.cos(a+Math.PI/7),y2-head*Math.sin(a+Math.PI/7));
    ctx.closePath();ctx.fill();
  }else if(s.t==="text"){
    const px=Math.max(8,(s.s||46)*u);
    ctx.font=fontFor(px);ctx.textBaseline="top";ctx.lineJoin="round";
    String(s.text).split("\n").forEach((ln,i)=>{
      const y=s.y*H+i*px*1.2;
      ctx.lineWidth=px*0.2;ctx.strokeStyle="rgba(0,0,0,0.7)";
      ctx.strokeText(ln,s.x*W,y);ctx.fillText(ln,s.x*W,y);
    });
  }
  ctx.restore();
}

const app=document.getElementById("app"),q=document.getElementById("q"),nav=document.getElementById("stepnav"),themeBtn=document.getElementById("theme");
const enc=encodeURIComponent;
let navDir="",curCat=null,curGrp=null,curStep=null,curChoice=null;

function h(tag,attrs){
  const e=document.createElement(tag);
  const at=attrs||{};
  for(const k in at){
    const v=at[k];
    if(k==="class")e.className=v;
    else if(k.indexOf("on")===0)e.addEventListener(k.slice(2),v);
    else if(v!==null&&v!==undefined&&v!==false)e.setAttribute(k,v===true?"":v);
  }
  Array.prototype.slice.call(arguments,2).flat().forEach(function(c){
    if(c===null||c===undefined||c===false)return;
    e.append(c.nodeType?c:document.createTextNode(String(c)));
  });
  return e;
}
function link(el,fn){el.addEventListener("click",function(ev){ev.preventDefault();fn();});return el;}
function norm(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function totalSteps(c){let n=0;c.groups.forEach(function(g){n+=g.steps.length;});return n;}
function setTitle(t){document.title=t?t+" – "+DATA.title:DATA.title;}
function go(hash){q.value="";if(location.hash===hash)route();else location.hash=hash;}
function findStep(g,id){return g.steps.find(function(s){return s.id===id;});}
function stepIndex(g,id){return g.steps.findIndex(function(s){return s.id===id;});}
function crumbs(parts){
  const out=[];
  parts.forEach(function(p,i){
    if(i)out.push(" › ");
    if(p[1]){out.push(link(h("a",null,p[0]),function(){go(p[1]);}));}
    else{out.push(h("span",null,p[0]));}
  });
  return h("div",{class:"crumbs"},out);
}

const INDEX=[];
DATA.categories.forEach(function(c){c.groups.forEach(function(g){g.steps.forEach(function(s,i){
  let hay=[c.name,g.name,s.title,s.text,s.info];
  (s.substeps||[]).forEach(function(ss){hay.push(ss.text||"");hay.push(ss.info||"");});
  (s.choices||[]).forEach(function(ch){
    hay.push(ch.label||"");
    (ch.substeps||[]).forEach(function(ss){hay.push(ss.text||"");hay.push(ss.info||"");});
  });
  INDEX.push({c:c,g:g,s:s,i:i,hay:norm(hay.join(" "))});
});});});

function homeView(){
  setTitle("");
  curCat=curGrp=curStep=curChoice=null;
  app.append(h("h1",{class:"title"},"Was möchtest du tun?"));
  if(!DATA.categories.length){
    app.append(h("p",{class:"muted"},"Noch keine Inhalte vorhanden."));return;
  }
  const grid=h("div",{class:"grid"});
  DATA.categories.forEach(function(c){
    const box=link(h("div",{class:"catbox"},
      h("div",{class:"icon"},"›"),
      h("div",{class:"txt"},
        h("h2",null,c.name),
        h("div",{class:"sub"},c.groups.length+" Themen · "+totalSteps(c)+" Schritte")),
      h("div",{class:"chev"},"›")),
      function(){go("#/"+enc(c.id));});
    grid.append(box);
  });
  app.append(grid);
}
function catView(c){
  setTitle(c.name);curCat=c;curGrp=curStep=curChoice=null;
  app.append(crumbs([["Start","#/"],[c.name,null]]));
  app.append(h("h1",{class:"title"},c.name));
  if(!c.groups.length){app.append(h("p",{class:"muted"},"In dieser Kategorie gibt es noch keine Themen."));return;}
  app.append(h("p",{class:"muted"},"Wähle ein Thema aus."));
  const grid=h("div",{class:"grid"});
  c.groups.forEach(function(g){
    const card=link(h("div",{class:"card row"},
      h("span",{class:"badge"},g.steps.length),
      h("div",{class:"txt"},h("h3",null,g.name),
        h("div",{class:"muted"},g.steps.length+" Schritte"))),
      function(){go("#/"+enc(c.id)+"/"+enc(g.id));});
    grid.append(card);
  });
  app.append(grid);
}
function grpView(c,g){
  setTitle(g.name);curCat=c;curGrp=g;curStep=curChoice=null;
  const base="#/"+enc(c.id)+"/"+enc(g.id);
  app.append(crumbs([["Start","#/"],[c.name,"#/"+enc(c.id)],[g.name,null]]));
  app.append(h("h1",{class:"title"},g.name));
  if(!g.steps.length){app.append(h("p",{class:"muted"},"Für dieses Thema sind noch keine Schritte vorhanden."));return;}
  const startBtn=link(h("a",{class:"btn",href:base+"/"+enc(g.steps[0].id)},"▶ Anleitung starten"),
    function(){go(base+"/"+enc(g.steps[0].id));});
  app.append(h("p",null,startBtn));
  app.append(h("p",{class:"muted"},"Oder direkt einen Schritt auswählen:"));
  const grid=h("div",{class:"grid"});
  g.steps.forEach(function(s,i){
    const card=link(h("div",{class:"card row"},
      h("span",{class:"badge"},i+1),
      h("div",{class:"txt"},h("h3",null,s.title),
        s.text?h("div",{class:"muted"},s.text.replace(/\s+/g," ").slice(0,80)):null)),
      function(){go(base+"/"+enc(s.id));});
    grid.append(card);
  });
  app.append(grid);
}
function mount(canvas,s){
  canvas.width=s.w||1200;canvas.height=s.h||900;
  const im=new Image();
  im.onload=function(){
    canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;
    const x=canvas.getContext("2d");
    x.drawImage(im,0,0);
    (s.shapes||[]).forEach(function(sh){drawShape(x,sh,canvas.width,canvas.height);});
  };
  im.src=s.img;
}
function mediaFor(block,title){
  if(!block.img)return null;
  const canvas=h("canvas",{role:"img","aria-label":title});
  const media=h("div",{class:"media"},canvas);
  mount(canvas,block);
  if(block.info&&String(block.info).trim()){
    const panel=h("div",{class:"info-panel",role:"note"},block.info);panel.hidden=true;
    const btn=h("button",{class:"info-btn",type:"button","aria-label":"Zusatzinfo anzeigen"},"i");
    btn.onclick=function(e){e.stopPropagation();panel.hidden=!panel.hidden;};
    panel.addEventListener("click",function(){panel.hidden=true;});
    media.append(btn,panel);
  }
  return media;
}

/* ---------- Hauptablauf eines Schritts (Hauptinhalt + eigene Zwischenschritte) ---------- */
function stepView(c,g,stepId,pos,dir){
  const s=findStep(g,stepId);
  if(!s){grpView(c,g);return;}
  curCat=c;curGrp=g;curStep=s;curChoice=null;
  const base="#/"+enc(c.id)+"/"+enc(g.id);
  const stepBase=base+"/"+enc(s.id);
  setTitle(s.title);
  app.classList.add("has-nav");

  const choices=Array.isArray(s.choices)?s.choices:[];
  const substeps=Array.isArray(s.substeps)?s.substeps:[];
  const totalBlocks=1+substeps.length;
  const idx=Math.max(0,Math.min(totalBlocks-1,pos|0));
  const isLast=idx===totalBlocks-1;
  const si=stepIndex(g,stepId);
  const prevStep=g.steps[si-1];
  const nextStep=g.steps[si+1];

  const goPrev=function(){
    if(idx>0)go(stepBase+"/"+(idx-1));
    else if(prevStep)go(base+"/"+enc(prevStep.id));
    else go(base);
  };
  const goNext=function(){
    if(!isLast)go(stepBase+"/"+(idx+1));
    else if(nextStep)go(base+"/"+enc(nextStep.id));
    else go(base);
  };
  const openChoice=function(chId){
    go(stepBase+"/br/"+enc(chId));
  };

  const wrap=h("section",{class:"step "+(dir==="back"?"from-left":dir==="fwd"?"from-right":"")});
  wrap.append(crumbs([[c.name,"#/"+enc(c.id)],[g.name,base]]),
              h("div",{class:"progress"},h("div",{style:"width:"+((idx+1)/totalBlocks*100)+"%"})),
              h("h1",{class:"title"},s.title));

  const block = idx===0 ? s : substeps[idx-1];
  if(idx>0)wrap.append(h("span",{class:"substep-badge"},"Zwischenschritt "+idx+" von "+substeps.length));
  const media=mediaFor(block,s.title);
  if(media)wrap.append(media);
  if(block.text)wrap.append(h("div",{class:"instr"},block.text));

  if(isLast&&choices.length){
    const box=h("div",{class:"choices"},h("div",{class:"head"},"Wie möchtest du fortfahren?"));
    choices.forEach(function(ch){
      const b=h("button",{class:"choice-btn",type:"button"},
        h("span",null,ch.label),
        h("span",{class:"arrow"},"›"));
      b.addEventListener("click",function(){openChoice(ch.id);});
      box.append(b);
    });
    wrap.append(box);
  }
  app.append(wrap);

  const preImg = !isLast ? (substeps[idx].img) : (nextStep && nextStep.img);
  if(preImg){const pi=new Image();pi.src=preImg;}

  let x0=0,y0=0,t0=0;
  wrap.addEventListener("touchstart",function(e){const t=e.changedTouches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();},{passive:true});
  wrap.addEventListener("touchend",function(e){
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Date.now()-t0<700&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){
      if(dx<0){if(!(isLast&&choices.length))goNext();}
      else{goPrev();}
    }
  },{passive:true});

  nav.hidden=false;
  const backLabel=idx>0?"‹ Vorheriger":(prevStep?"‹ Zurück":"‹ Übersicht");
  if(isLast&&choices.length){
    // Wahl oben im Content, unten nur Zurück
    nav.replaceChildren(h("div",{class:"in"},
      h("button",{class:"nbtn",type:"button",onclick:goPrev},backLabel),
      h("div",{class:"counter"},(idx+1)+" / "+totalBlocks)));
  }else{
    let nextLabel="Weiter ›";
    if(!isLast)nextLabel=(idx+1<totalBlocks-1)?"Nächster Zwischenschritt ›":"Letzter Zwischenschritt ›";
    else if(!nextStep)nextLabel="Fertig ✓";
    nav.replaceChildren(h("div",{class:"in"},
      h("button",{class:"nbtn",type:"button",onclick:goPrev},backLabel),
      h("div",{class:"counter"},(idx+1)+" / "+totalBlocks),
      h("button",{class:"nbtn primary",type:"button",onclick:goNext},nextLabel)));
  }
}

/* ---------- Choice-Ablauf: durchläuft die Zwischenschritte einer Option ---------- */
function choiceView(c,g,stepId,choiceId,pos,dir){
  const s=findStep(g,stepId);
  if(!s){grpView(c,g);return;}
  const ch=(s.choices||[]).find(function(x){return x.id===choiceId;});
  if(!ch){stepView(c,g,stepId,0,dir);return;}
  curCat=c;curGrp=g;curStep=s;curChoice=ch;

  const base="#/"+enc(c.id)+"/"+enc(g.id);
  const stepBase=base+"/"+enc(s.id);
  const choiceBase=stepBase+"/br/"+enc(ch.id);
  setTitle(ch.label);
  app.classList.add("has-nav");

  const subs=Array.isArray(ch.substeps)?ch.substeps:[];
  const total=Math.max(1,subs.length);
  const idx=Math.max(0,Math.min(total-1,pos|0));
  const isLast=idx>=total-1;

  const goPrev=function(){
    if(idx>0)go(choiceBase+"/"+(idx-1));
    else go(stepBase);  // zurück zur Auswahl
  };
  const goNext=function(){
    if(!isLast)go(choiceBase+"/"+(idx+1));
    else go(base);  // Fertig -> zurück zur Themen-Übersicht
  };

  const wrap=h("section",{class:"step "+(dir==="back"?"from-left":dir==="fwd"?"from-right":"")});
  wrap.append(crumbs([[c.name,"#/"+enc(c.id)],[g.name,base],[s.title,stepBase],[ch.label,null]]),
              h("div",{class:"progress"},h("div",{style:"width:"+((idx+1)/total*100)+"%"})),
              h("h1",{class:"title"},ch.label));

  if(subs.length===0){
    wrap.append(h("div",{class:"instr"},"Für diese Auswahl sind noch keine Bilder hinterlegt."));
  }else{
    const block=subs[idx];
    if(subs.length>1)wrap.append(h("span",{class:"substep-badge"},"Schritt "+(idx+1)+" von "+subs.length));
    const media=mediaFor(block,ch.label);
    if(media)wrap.append(media);
    if(block.text)wrap.append(h("div",{class:"instr"},block.text));
  }
  app.append(wrap);

  if(!isLast&&subs[idx+1]&&subs[idx+1].img){const pi=new Image();pi.src=subs[idx+1].img;}

  let x0=0,y0=0,t0=0;
  wrap.addEventListener("touchstart",function(e){const t=e.changedTouches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();},{passive:true});
  wrap.addEventListener("touchend",function(e){
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Date.now()-t0<700&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){
      if(dx<0)goNext();else goPrev();
    }
  },{passive:true});

  nav.hidden=false;
  nav.replaceChildren(h("div",{class:"in"},
    h("button",{class:"nbtn",type:"button",onclick:goPrev},idx>0?"‹ Zurück":"‹ Auswahl"),
    h("div",{class:"counter"},(idx+1)+" / "+total),
    h("button",{class:"nbtn primary",type:"button",onclick:goNext},isLast?"Fertig ✓":"Weiter ›")));
}

function renderSearch(){
  app.replaceChildren();app.classList.remove("has-nav");nav.hidden=true;curCat=curGrp=curStep=curChoice=null;
  const toks=norm(q.value).split(/\s+/).filter(Boolean);
  const res=INDEX.filter(function(e){return toks.every(function(t){return e.hay.indexOf(t)>=0;});}).slice(0,60);
  app.append(h("div",{class:"muted",style:"margin-bottom:10px"},res.length?res.length+" Treffer":"Keine Treffer"));
  const grid=h("div",{class:"grid"});
  res.forEach(function(e){
    const target="#/"+enc(e.c.id)+"/"+enc(e.g.id)+"/"+enc(e.s.id);
    const snip=(e.s.text||"").replace(/\s+/g," ").slice(0,110);
    const card=link(h("div",{class:"card"},
      h("div",{class:"muted"},e.c.name+" › "+e.g.name+" · Schritt "+(e.i+1)),
      h("h3",null,e.s.title),snip?h("div",{class:"muted"},snip):null),
      function(){go(target);});
    grid.append(card);
  });
  app.append(grid);
}

function route(){
  const dir=navDir;navDir="";
  nav.hidden=true;nav.replaceChildren();
  app.classList.remove("has-nav");app.replaceChildren();
  window.scrollTo(0,0);
  const p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);
  const c=DATA.categories.find(function(x){return x.id===p[0];});
  if(!c){homeView();return;}
  const g=p[1]?c.groups.find(function(x){return x.id===p[1];}):null;
  if(!g){catView(c);return;}
  if(p[2]===undefined){grpView(c,g);return;}

  // Prüfen ob es sich um einen Choice-Ablauf handelt: .../stepId/br/choiceId[/subIdx]
  if(p[3]==="br"&&p[4]){
    let pos=0;
    if(p[5]!==undefined){const n=parseInt(p[5],10);pos=isNaN(n)?0:n;}
    choiceView(c,g,p[2],p[4],pos,dir);
    return;
  }

  // Sonst: Hauptablauf (optional Position)
  let pos=0;
  if(p[3]!==undefined){const n=parseInt(p[3],10);pos=isNaN(n)?0:n;}
  stepView(c,g,p[2],pos,dir);
}

function setTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  try{localStorage.setItem("theme",t);}catch(e){}
  themeBtn.textContent=t==="dark"?"☀️":"🌙";
  themeBtn.setAttribute("aria-label",t==="dark"?"Helles Design":"Dunkles Design");
  document.getElementById("tc").setAttribute("content",t==="dark"?"#1a2028":"#ffffff");
}
themeBtn.addEventListener("click",function(){
  setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
});
const brand=document.getElementById("brand");
brand.textContent=DATA.title;
brand.addEventListener("click",function(e){e.preventDefault();go("#/");});
window.addEventListener("hashchange",function(){q.value="";route();});
q.addEventListener("input",function(){if(q.value.trim())renderSearch();else route();});
setTheme(document.documentElement.getAttribute("data-theme")||"light");
route();
})();
</script></body></html>
